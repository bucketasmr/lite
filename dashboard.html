<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMR Premium Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-viewers: #38bdf8;
            --accent-clicks: #f43f5e;
            --accent-sub: #10b981;
            --accent-purple: #a855f7;
            --badge-green: #10b981;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, rgba(56, 189, 248, 0.1), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(244, 63, 94, 0.1), transparent 40%);
        }

        .dashboard {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card.viewers:hover { box-shadow: 0 8px 20px rgba(56, 189, 248, 0.15); }
        .card.clicks:hover { box-shadow: 0 8px 20px rgba(244, 63, 94, 0.15); }
        .card.buttons:hover { box-shadow: 0 8px 20px rgba(168, 85, 247, 0.15); }

        .card-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
        }

        .viewers .card-value { color: var(--accent-viewers); }
        .clicks .card-value { color: var(--accent-clicks); }

        .delta-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--badge-green);
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 3px 8px;
            border-radius: 12px;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .dual-counters {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .counter-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .counter-sublabel {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .clicks-details {
            width: 100%;
            margin-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .details-row span:last-child {
            color: var(--text-main);
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .indicator {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>ASMR Premium Live Status</h1>
        
        <div class="stats-grid">
            <!-- ЗРИТЕЛИ ОНЛАЙН -->
            <div class="card viewers">
                <span class="card-label">Зрители онлайн</span>
                <span class="card-value" id="viewers-count">0</span>
            </div>
            
            <!-- ВСЕГО ПРОСМОТРОВ -->
            <div class="card" style="border-left: 4px solid var(--accent-sub, #10b981); display: flex; flex-direction: column;">
                <span class="card-label">Всего просмотров</span>
                <span class="card-value" id="views-count" style="color: var(--accent-sub, #10b981);">0</span>
                <div class="delta-badge" id="views-delta">+0 визит / +0 сут.</div>
            </div>
            
            <!-- ВСЕГО КЛИКОВ ПО ССЫЛКАМ -->
            <div class="card clicks">
                <span class="card-label">Всего кликов по ссылкам</span>
                <span class="card-value" id="clicks-count">0</span>
                <div class="delta-badge" id="clicks-delta">+0 визит / +0 сут.</div>
                
                <div class="clicks-details" id="clicks-platforms"></div>
            </div>

            <!-- ПОПУЛЯРНОСТЬ КНОПОК И ЗВУКОВ -->
            <div class="card buttons" style="border-left: 4px solid var(--accent-purple); align-items: stretch;">
                <span class="card-label" style="text-align: center;">Популярность кнопок и звуков</span>
                
                <div class="dual-counters">
                    <div class="counter-item">
                        <span class="counter-sublabel">Всего нажатий</span>
                        <span class="card-value" id="total-button-clicks" style="color: var(--accent-purple);">0</span>
                        <div class="delta-badge" id="total-btn-delta">+0 визит / +0 сут.</div>
                    </div>
                    <div class="counter-item">
                        <span class="counter-sublabel">Только звуки</span>
                        <span class="card-value" id="sound-button-clicks" style="color: var(--accent-viewers);">0</span>
                        <div class="delta-badge" id="sound-btn-delta">+0 визит / +0 сут.</div>
                    </div>
                </div>

                <div id="button-clicks-container" style="max-height: 220px; overflow-y: auto; margin-top: 10px; font-size: 14px; width: 100%; padding-right: 4px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 10px;">
                    <div style="color: var(--text-muted); text-align: center;">Загрузка статистики...</div>
                </div>
            </div>
        </div>

        <div class="status">
            <div class="indicator"></div>
            <span>Синхронизация с Realtime Database</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, get, set, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "1:977463565728:web:a35a91ce071d1f0d2a98c5", 
            authDomain: "bucket-asmr-premium.firebaseapp.com",
            databaseURL: "https://bucket-asmr-premium-default-rtdb.firebaseio.com",
            projectId: "bucket-asmr-premium",
            storageBucket: "bucket-asmr-premium.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Элементы UI
        const viewersElement = document.getElementById('viewers-count');
        const clicksElement = document.getElementById('clicks-count');
        const platformsContainer = document.getElementById('clicks-platforms');
        const viewsElement = document.getElementById('views-count');
        
        const totalButtonClicksElem = document.getElementById('total-button-clicks');
        const soundButtonClicksElem = document.getElementById('sound-button-clicks');
        const buttonContainer = document.getElementById('button-clicks-container');

        // Элементы дельты
        const viewsDeltaElem = document.getElementById('views-delta');
        const clicksDeltaElem = document.getElementById('clicks-delta');
        const totalBtnDeltaElem = document.getElementById('total-btn-delta');
        const soundBtnDeltaElem = document.getElementById('sound-btn-delta');

        // Текущее live-состояние
        let currentLiveState = { page_views: 0, link_clicks: 0, total_buttons: 0, sound_buttons: 0 };
        
        // Якори отсчета
        let sessionStartState = null; // Старт текущей сессии (не сбрасывается от F5)
        let dayAgoState = null;        // Срез за вчера

        const getTodayKey = () => new Date().toISOString().split('T')[0];
        const getYesterdayKey = () => {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            return d.toISOString().split('T')[0];
        };

        async function initVisitTracking() {
            try {
                // 1. ПРОВЕРЯЕМ СЕССИЮ В БРАУЗЕРЕ
                const savedSession = sessionStorage.getItem('dashboard_session_start');
                
                if (savedSession) {
                    sessionStartState = JSON.parse(savedSession);
                } else {
                    // Если это новый заход — читаем последнюю запись до нас из Firebase
                    const visitsRef = ref(database, 'dashboard_stats/visits_history');
                    const visitsSnap = await get(visitsRef);
                    
                    if (visitsSnap.exists()) {
                        const visitsData = Object.values(visitsSnap.val());
                        sessionStartState = visitsData[visitsData.length - 1];
                    } else {
                        sessionStartState = { page_views: 0, link_clicks: 0, total_buttons: 0, sound_buttons: 0 };
                    }
                    // Запоминаем якорь в памяти сессии браузера
                    sessionStorage.setItem('dashboard_session_start', JSON.stringify(sessionStartState));
                }

                // 2. ПОЛУЧАЕМ СУТОЧНЫЙ СРЕЗ (За вчера)
                const yesterdayRef = ref(database, `daily_history/${getYesterdayKey()}`);
                const yesterdaySnap = await get(yesterdayRef);
                if (yesterdaySnap.exists()) {
                    dayAgoState = yesterdaySnap.val();
                }

                // 3. ЗАПИСЫВАЕМ СНИМОК В БАЗУ ДЛЯ БУДУЩИХ ЗАХОДОВ (с задержкой 3 сек)
                setTimeout(async () => {
                    if (currentLiveState.total_buttons > 0 || currentLiveState.page_views > 0) {
                        const newVisitRef = push(ref(database, 'dashboard_stats/visits_history'));
                        await set(newVisitRef, {
                            timestamp: Date.now(),
                            ...currentLiveState
                        });

                        const todayRef = ref(database, `daily_history/${getTodayKey()}`);
                        const todaySnap = await get(todayRef);
                        if (!todaySnap.exists()) {
                            await set(todayRef, {
                                timestamp: Date.now(),
                                ...currentLiveState
                            });
                        }
                    }
                }, 3000);

            } catch (err) {
                console.error("Ошибка инициализации истории:", err);
            }
        }

        function updateDeltas() {
            const calcDelta = (current, startStateVal, dayAgoStateVal) => {
                const startVal = typeof startStateVal === 'number' ? startStateVal : current;
                const vDiff = Math.max(0, current - startVal);
                
                const dayVal = typeof dayAgoStateVal === 'number' ? dayAgoStateVal : current;
                const dDiff = Math.max(0, current - dayVal);

                return `+${vDiff} визит / +${dDiff} сут.`;
            };

            viewsDeltaElem.textContent = calcDelta(
                currentLiveState.page_views, 
                sessionStartState?.page_views, 
                dayAgoState?.page_views
            );
            clicksDeltaElem.textContent = calcDelta(
                currentLiveState.link_clicks, 
                sessionStartState?.link_clicks, 
                dayAgoState?.link_clicks
            );
            totalBtnDeltaElem.textContent = calcDelta(
                currentLiveState.total_buttons, 
                sessionStartState?.total_buttons, 
                dayAgoState?.total_buttons
            );
            soundBtnDeltaElem.textContent = calcDelta(
                currentLiveState.sound_buttons, 
                sessionStartState?.sound_buttons, 
                dayAgoState?.sound_buttons
            );
        }

        // --- СЛУШАТЕЛИ REALTIME DATABASE ---

        // 1. Онлайн зрители
        onValue(ref(database, 'online_users'), (snapshot) => {
            viewersElement.textContent = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
        });

        // 2. Просмотры
        onValue(ref(database, 'page_views'), (snapshot) => {
            const val = snapshot.exists() ? snapshot.val() : 0;
            viewsElement.textContent = val;
            currentLiveState.page_views = val;
            updateDeltas();
        });

        // 3. Клики по ссылкам
        onValue(ref(database, 'link_clicks'), (snapshot) => {
            if (snapshot.exists()) {
                const platformsData = snapshot.val();
                let totalClicks = 0;
                let htmlDetails = '';

                for (const platform in platformsData) {
                    const clicks = platformsData[platform];
                    if (typeof clicks === 'number') {
                        totalClicks += clicks;
                        const platformName = platform.charAt(0).toUpperCase() + platform.slice(1);
                        htmlDetails += `
                            <div class="details-row">
                                <span>${platformName}:</span>
                                <span>${clicks}</span>
                            </div>
                        `;
                    }
                }
                clicksElement.textContent = totalClicks;
                platformsContainer.innerHTML = htmlDetails;
                currentLiveState.link_clicks = totalClicks;
            } else {
                clicksElement.textContent = 0;
                platformsContainer.innerHTML = '';
                currentLiveState.link_clicks = 0;
            }
            updateDeltas();
        });

        // 4. Кнопки и звуки
        onValue(ref(database, 'button_clicks'), (snapshot) => {
            if (snapshot.exists()) {
                const clicksData = snapshot.val();
                let totalAllClicks = 0;
                let totalSoundClicks = 0;
                let htmlDetails = '';

                const sortedButtons = Object.entries(clicksData).sort((a, b) => b[1] - a[1]);

                sortedButtons.forEach(([btnName, count]) => {
                    const clickNum = Number(count) || 0;
                    totalAllClicks += clickNum;

                    if (btnName.startsWith('sound_')) {
                        totalSoundClicks += clickNum;
                    }

                    let displayName = btnName
                        .replace("sound_", "🔊 ")
                        .replace("ui_", "⚙️ ")
                        .replace("link_", "🔗 ");
                    
                    htmlDetails += `
                        <div class="details-row" style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem;">
                            <span style="color: var(--text-muted); text-transform: capitalize;">${displayName}</span>
                            <span style="font-weight: 600; color: var(--text-main); margin-left: 10px;">${clickNum}</span>
                        </div>
                    `;
                });

                totalButtonClicksElem.textContent = totalAllClicks;
                soundButtonClicksElem.textContent = totalSoundClicks;
                buttonContainer.innerHTML = htmlDetails;

                currentLiveState.total_buttons = totalAllClicks;
                currentLiveState.sound_buttons = totalSoundClicks;
            } else {
                totalButtonClicksElem.textContent = 0;
                soundButtonClicksElem.textContent = 0;
                buttonContainer.innerHTML = '<div style="color: var(--text-muted); text-align: center;">Кликов пока нет</div>';
            }
            updateDeltas();
        });

        // Запуск логики сессии и истории
        initVisitTracking();
    </script>
</body>
</html>
