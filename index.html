  if (s.locked) {
    btn.classList.add('locked');
    btn.innerHTML = `<div class="lock-icon">🔒</div><div class="mute-btn">🔊</div><span>${s.name['en']}</span>`;
  } else {
    btn.innerHTML = `<div class="mute-btn">🔊</div><span>${s.name['en']}</span>`;
  }
  
  grid.appendChild(btn);

  const audio = new Audio();
  audio.loop = true;
  audio.crossOrigin = "anonymous";
  audio.setAttribute('playsinline', '');
  
  const state = { 
    audio, 
    btn, 
    active: false, 
    muted: false, 
    fileName: s.file, 
    imgName: s.img || null, 
    color: s.color, 
    loaded: false, 
    isFav: false, 
    locked: s.locked,
    fadeInterval: null 
  };

  btn.onclick = () => {
    if (state.locked) {
        // Если звук закрыт — вызываем всплывающее окно рекламы
        openUnlockModal(state);
    } else {
        // Если открыт — обычное поведение
        loadAudio(state);
        state.active ? fadeOut(state) : fadeIn(state);
    }
  };

  btn.querySelector('.mute-btn').onclick = (e) => {
    e.stopPropagation();
    if(state.locked) return;
    state.muted = !state.muted;
    if (state.muted) {
        state.audio.volume = 0;
    } else if (state.active) {
        state.audio.volume = 0.6;
    }
    btn.querySelector('.mute-btn').classList.toggle('muted', state.muted);
  };
  audioElements.push(state);

  const favItem = document.createElement('div');
  favItem.className = 'fav-item';
  favItem.innerHTML = `<input type="checkbox" id="check-${idx}"><label for="check-${idx}">${s.name['en']}</label>`;
  favItem.onclick = (e) => {
    e.stopPropagation();
    if(state.locked) return; // Нельзя добавить в избранное закрытый звук
    const checkbox = favItem.querySelector('input');
    if(e.target !== checkbox) checkbox.checked = !checkbox.checked;
    state.isFav = checkbox.checked;
    btn.classList.toggle('is-fav', state.isFav);
  };
  favDropdown.appendChild(favItem);
});

// Логика Рекламного Окна Разблокировки
function openUnlockModal(el) {
    pendingUnlockElement = el;
    const t = uiTL[langOrder[langIdx]];
    
    document.getElementById('unlockTitle').innerText = t.unlockTitle;
    document.getElementById('unlockDesc').innerText = t.unlockDesc;
    document.getElementById('watchAdBtn').innerText = t.watchVideo;
    document.getElementById('cancelUnlock').innerText = t.cancel;
    
    document.getElementById('adStatus').innerText = "Ready to Watch";
    document.getElementById('adProgress').style.width = "0%";
    document.getElementById('watchAdBtn').disabled = false;
    document.getElementById('watchAdBtn').style.opacity = "1";
    
    document.getElementById('unlockModal').style.display = 'flex';
}

document.getElementById('cancelUnlock').onclick = () => {
    document.getElementById('unlockModal').style.display = 'none';
    pendingUnlockElement = null;
};

document.getElementById('watchAdBtn').onclick = () => {
    if (!pendingUnlockElement) return;
    
    document.getElementById('watchAdBtn').disabled = true;
    document.getElementById('watchAdBtn').style.opacity = "0.3";
    
    let timeLeft = 5; // Имитация 5 секунд просмотра видео рекламы
    document.getElementById('adStatus').innerText = `Watching Ad... (${timeLeft}s)`;
    document.getElementById('adProgress').style.width = "100%";
    document.getElementById('adProgress').style.transition = "width 5s linear";
    
    const adCountdown = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
            document.getElementById('adStatus').innerText = `Watching Ad... (${timeLeft}s)`;
        } else {
            clearInterval(adCountdown);
            // Видео просмотрено! Разблокируем триггер
            document.getElementById('adStatus').innerText = "Success Unlocked! 🎉";
            setTimeout(() => {
                if (pendingUnlockElement) {
                    pendingUnlockElement.locked = false;
                    pendingUnlockElement.btn.classList.remove('locked');
                    const lockIcon = pendingUnlockElement.btn.querySelector('.lock-icon');
                    if (lockIcon) lockIcon.remove();
                    
                    loadAudio(pendingUnlockElement); // Подгружаем аудио сразу
                    
                    document.getElementById('unlockModal').style.display = 'none';
                    pendingUnlockElement = null;
                    updateUI();
                }
            }, 800);
        }
    }, 1000);
};

function fadeIn(el) {
  if(el.locked) return;
  if(el.fadeInterval) clearInterval(el.fadeInterval);
  el.active = true; el.btn.classList.add('active');
  el.btn.style.backgroundColor = el.color + "44";
  el.audio.volume = 0;
  
  el.audio.play().catch(e => {});

  let v = 0;
  el.fadeInterval = setInterval(() => {
    if (v < 0.6 && !el.muted) { v += 0.05; el.audio.volume = Math.min(v, 0.6); } 
    else { clearInterval(el.fadeInterval); el.fadeInterval = null; }
  }, 50);
}

function fadeOut(el) {
  if(el.fadeInterval) clearInterval(el.fadeInterval);
  el.active = false; el.btn.classList.remove('active');
  el.btn.style.backgroundColor = "";
  
  let v = el.audio.volume;
  el.fadeInterval = setInterval(() => {
    if (v > 0.05) { v -= 0.05; el.audio.volume = v; } 
    else { el.audio.volume = 0; el.audio.pause(); clearInterval(el.fadeInterval); el.fadeInterval = null; }
  }, 50);
}

document.getElementById('randomBtn').onclick = () => {
  randomActive = !randomActive;
  if (randomActive) { 
    // В автоматическом пуле участвуют только РАЗБЛОКИРОВАННЫЕ звуки
    const favs = audioElements.filter(el => el.isFav && !el.locked);
    if(favs.length > 0) favs.forEach(el => loadAudio(el));
    runRandom(); 
  } else { 
    clearTimeout(nextCycleTimeout);
    audioElements.forEach(el => {
        el.active = false; 
        el.btn.classList.remove('active'); 
        el.btn.style.backgroundColor = "";
        if(el.fadeInterval) clearInterval(el.fadeInterval); 
        el.audio.pause();
        el.audio.volume = 0;
    });
  }
  updateUI();
};

function runRandom() {
  if (!randomActive) return;

  // Фильтруем пул: только то, что НЕ заблокировано рекламой
  let pool = audioElements.filter(el => el.isFav && !el.muted && !el.locked);
  if (pool.length === 0) {
      pool = audioElements.filter(el => !el.muted && !el.locked);
  }

  const unloadedInPool = pool.filter(el => !el.loaded);
  if (unloadedInPool.length > 0) {
      unloadedInPool.forEach(el => loadAudio(el));
      nextCycleTimeout = setTimeout(runRandom, 1500);
      return;
  }

  const count = Math.floor(Math.random() * 2) + 1;
  const toPlay = pool.sort(() => 0.5 - Math.random()).slice(0, count);
  
  audioElements.forEach(el => {
    if (toPlay.includes(el)) { 
        if(!el.active) fadeIn(el); 
    } else { 
        if(el.active) fadeOut(el); 
    }
  });

  nextCycleTimeout = setTimeout(runRandom, currentSpeedValue * 1000);
}

function updateUI() {
  const t = uiTL[langOrder[langIdx]];
  document.getElementById('title').innerText = t.title;
  document.querySelectorAll('.lang-switcher-btn').forEach(btn => btn.innerText = t.code);
  document.getElementById('randomBtn').innerText = randomActive ? t.pause : t.play;
  document.getElementById('repairBtn').innerText = t.repair;
  document.getElementById('sleepBtn').innerText = `${t.sleep}: ${sleepMode ? 'ON' : 'OFF'}`;
  let speedKey = (currentSpeedValue === 22) ? 'fast' : (currentSpeedValue === 52) ? 'slow' : 'medium';
  document.getElementById('speedTrigger').innerText = t.speeds[speedKey];
  document.getElementById('spFast').innerText = t.speeds.fast;
  document.getElementById('spMed').innerText = t.speeds.medium;
  document.getElementById('spSlow').innerText = t.speeds.slow;
  document.getElementById('tabTitleFeatures').innerText = t.tabFeatures;
  document.getElementById('tabTitleGuide').innerText = t.tabGuide;
  document.getElementById('featuresList').innerHTML = t.features.map(item => `<li>${item}</li>`).join('');
  document.getElementById('guideList').innerHTML = t.guide.map(item => `<li>${item}</li>`).join('');
  
  audioElements.forEach((el, i) => {
      const name = sounds[i].name[langOrder[langIdx]];
      el.btn.querySelector('span').innerText = name;
      favDropdown.querySelectorAll('label')[i].innerText = name;
      
      // Скрываем чекбокс в избранном, если элемент еще заблокирован рекламой
      const checkInput = favDropdown.querySelectorAll('input')[i];
      if (el.locked) {
          checkInput.disabled = true;
          checkInput.parentElement.style.opacity = "0.4";
      } else {
          checkInput.disabled = false;
          checkInput.parentElement.style.opacity = "1";
      }
  });
}

function updateConnections() {
    if (!presenceRef) {
        presenceRef = connectionsRef.push(true);
        presenceRef.onDisconnect().remove();
    }
    const fetchCount = () => {
        connectionsRef.once('value', snap => {
            document.getElementById('online-count').innerText = snap.numChildren() || 1;
        });
    };
    fetchCount();
    if(liveInterval) clearInterval(liveInterval);
    liveInterval = setInterval(fetchCount, 60000); 
}

function setSpeed(v, label) {
    currentSpeedValue = v;
    document.getElementById('speedDropdown').classList.remove('open');
    updateUI();
    if(randomActive) { clearTimeout(nextCycleTimeout); runRandom(); }
}

document.getElementById('speedTrigger').onclick = (e) => { e.stopPropagation(); favDropdown.classList.remove('open'); document.getElementById('speedDropdown').classList.toggle('open'); };
document.getElementById('favBtn').onclick = (e) => { e.stopPropagation(); document.getElementById('speedDropdown').classList.remove('open'); favDropdown.classList.toggle('open'); };
document.addEventListener('click', () => { document.getElementById('speedDropdown').classList.remove('open'); favDropdown.classList.remove('open'); });
document.getElementById('repairBtn').onclick = () => location.reload();
document.getElementById('closeWelcome').onclick = () => { document.getElementById('welcomeModal').style.display = 'none'; };
document.querySelectorAll('.lang-switcher-btn').forEach(btn => { btn.onclick = (e) => { e.stopPropagation(); langIdx = (langIdx + 1) % 4; updateUI(); }; });

document.getElementById('sleepBtn').onclick = () => {
    sleepMode = !sleepMode;
    document.body.style.background = sleepMode ? "#000" : "";
    document.getElementById('stars').style.opacity = sleepMode ? "0" : "1";
    document.getElementById('sleepBtn').classList.toggle('active', sleepMode);
    document.getElementById('soundGrid').classList.toggle('hidden', sleepMode);
    document.getElementById('bannerBlock').style.display = sleepMode ? "none" : "flex";
    if (sleepMode) {
      if(presenceRef) presenceRef.remove();
      presenceRef = null;
      if(liveInterval) clearInterval(liveInterval);
      firebase.database().goOffline();
      document.getElementById('online-count').innerText = "ECO";
      steamParticles = [];
    } else {
      firebase.database().goOnline();
      updateConnections();
    }
    updateUI();
};

// Инициализация Эффектов Canvas
const canvas = document.getElementById('stars'), ctx = canvas.getContext('2d');
const steamCanvas = document.getElementById('steamCanvas'), sCtx = steamCanvas.getContext('2d');

function resize() { 
  canvas.width = innerWidth; canvas.height = innerHeight; 
  steamCanvas.width = innerWidth; steamCanvas.height = innerHeight;
}
window.onresize = resize; resize();

const starsArr = Array.from({length: 70}, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.5, a: Math.random(), s: Math.random() * 0.01 }));

function spawnSteam() {
  if (sleepMode) return;
  
  audioElements.forEach(el => {
    if (el.active && !el.locked) {
      const rect = el.btn.getBoundingClientRect();
      if (Math.random() < 0.15) { 
        steamParticles.push({
          x: rect.left + Math.random() * rect.width,
          y: rect.top + rect.height * 0.7,
          vx: (Math.random() - 0.5) * 0.4,
          vy: -(Math.random() * 0.6 + 0.4),
          size: Math.random() * 15 + 10,
          alpha: Math.random() * 0.3 + 0.2,
          growth: Math.random() * 0.1 + 0.05
        });
      }
    }
  });
}

function draw() {
  if(!sleepMode) {
    ctx.clearRect(0,0,innerWidth,innerHeight);
    starsArr.forEach(s => {
      s.a += s.s; if(s.a > 1 || s.a < 0) s.s *= -1;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${Math.abs(s.a)})`; ctx.fill();
    });
  } else { ctx.clearRect(0,0,innerWidth,innerHeight); }

  sCtx.clearRect(0, 0, innerWidth, innerHeight);
  if (!sleepMode && steamParticles.length > 0) {
    spawnSteam();
    
    for (let i = steamParticles.length - 1; i >= 0; i--) {
      let p = steamParticles[i];
      p.x += p.vx; p.y += p.vy; p.size += p.growth; p.alpha -= 0.003;

      if (p.alpha <= 0) {
        steamParticles.splice(i, 1);
        continue;
      }

      sCtx.beginPath();
      let gradient = sCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      gradient.addColorStop(0, `rgba(138, 43, 226, ${p.alpha})`);
      gradient.addColorStop(0.5, `rgba(138, 43, 226, ${p.alpha * 0.4})`);
      gradient.addColorStop(1, 'rgba(138, 43, 226, 0)');
      
      sCtx.fillStyle = gradient;
      sCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      sCtx.fill();
    }
  } else if (!sleepMode) {
    spawnSteam();
  }

  requestAnimationFrame(draw);
}

draw();
// Запуск приветственного окна
document.getElementById('welcomeModal').style.display = 'flex';
updateUI();

function switchTab(event, tabId) {
    document.querySelectorAll('.help-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
}
function showHelp() { document.getElementById('welcomeModal').style.display = 'flex'; }
</script>
